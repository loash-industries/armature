name: PR Validation

permissions:
  contents: read
  pull-requests: read
  checks: write
  packages: read

on:
  pull_request:
    branches:
      - main

# concurrency:
  # group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # cancel-in-progress: true

jobs:
  # Detect which paths changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      move: ${{ steps.filter.outputs.move }}
      whitepaper: ${{ steps.filter.outputs.whitepaper }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            move:
              - 'packages/**'
              - '.github/workflows/**'
            whitepaper:
              - 'whitepaper/**'
              - '.github/workflows/**'

  # Move contracts: fmt, build, test
  move-contracts:
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.move == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Homebrew
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH

      - name: Install Sui CLI
        run: /home/linuxbrew/.linuxbrew/bin/brew install sui

      - name: Setup Node.js (for prettier-move)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check Move formatting (armature_framework)
        run: |
          npm i @mysten/prettier-plugin-move
          npx prettier-move -c packages/armature_framework/**/*.move

      - name: Check Move formatting (armature_proposals)
        run: |
          npm i @mysten/prettier-plugin-move
          npx prettier-move -c packages/armature_proposals/**/*.move

      - name: Check every ExecutionRequest consumer is gated (ROAD-39)
        run: python3 scripts/check_request_gates.py

      - name: Build Move packages
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/Move.toml" ]; then
              echo "Building $dir"
              sui move build --path "$dir"
            fi
          done

      - name: Test Move packages
        env:
          SUI_SKIP_SHARED_OBJECTS_VERSION_CHECK: 1
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/Move.toml" ]; then
              echo "Testing $dir"
              sui move test --path "$dir" -i 100000000 --force
            fi
          done

  # Build whitepaper PDF
  build-whitepaper:
    runs-on: ubuntu-latest
    needs:
      - changes
    if: needs.changes.outputs.whitepaper == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Typst
        uses: typst-community/setup-typst@48aeee7543d37f01afd1ffb27307dc277387ba13 # v4.3.1

      - name: Build whitepaper
        run: typst compile --root . whitepaper/main.typ whitepaper/paper.pdf

      - name: Upload whitepaper artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whitepaper
          path: whitepaper/paper.pdf
