name: Cortex Ingestion

on:
  push:
    branches: ["main"]
    paths:
      - .cortex/**
      - .github/workflows/cortex-ingest.yml
      - docs/**

jobs:
  cortex-ingest:
    uses: loash-industries/public-workflows/.github/workflows/js-cortex-ingest.yaml@7f3d345e01a92525698a5d6148497fa0e8e133e9 # v0.3.0
    if: github.ref == 'refs/heads/main'
    with:
      cortex_api_url: "https://cortex-relay-dev-api.trinary.exchange"
      npm_private_registry_url: "https://npm.pkg.github.com/"
      npm_client: yarn
    secrets:
      CORTEX_INGEST_TOKEN: ${{ secrets.CORTEX_INGEST_TOKEN }}
